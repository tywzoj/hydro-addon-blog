name: PR Validation

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - .vscode/**
      - "*.md"
      - LICENSE

concurrency:
  group: ${{ format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare --activate
          yarn install

      - name: Lint
        run: yarn lint

      - name: Type check
        timeout-minutes: 5
        run: yarn typecheck

      - name: Unit tests and coverage
        timeout-minutes: 5
        run: yarn test:coverage

      - name: End-to-end tests
        timeout-minutes: 8
        run: yarn test:e2e
